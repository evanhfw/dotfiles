# ~/.config/mise/config.toml — managed by chezmoi
#
# Versi di-pin supaya identik di macOS / Ubuntu / Arch.
#   mise ls                 → lihat yang terpasang
#   mise outdated           → cek versi baru
#   mise use -g node@latest → update versi
#   mise install            → pasang sesuai file ini
#
# Dipakai lewat shims (~/.local/share/mise/shims) yang di-prepend di .zshrc,
# jadi kebaca JUGA oleh proses non-interactive (editor, LSP, agen, CI lokal).

[tools]
bun  = "1.4.2"
node = "24.21.0"
pnpm = "12.4.2"
rust = "1.98.1"
uv   = "0.12.16"
